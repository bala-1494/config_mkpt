################################################################################
# Cloud Build — CI/CD pipeline
# Triggered on push to main branch.
# Builds all three service images and pushes to Artifact Registry,
# then deploys to the GCE instance via SSH.
#
# Required substitutions (set in Cloud Build trigger):
#   _REGION          : e.g. us-central1
#   _INSTANCE_NAME   : GCE instance name
#   _INSTANCE_ZONE   : e.g. us-central1-a
#   _AR_REPO         : Artifact Registry repo name (e.g. config-mkpt)
#   _PROJECT_ID      : GCP project id
################################################################################

substitutions:
  _REGION: us-central1
  _INSTANCE_ZONE: us-central1-a
  _AR_REPO: config-mkpt
  _AR_HOST: ${_REGION}-docker.pkg.dev

steps:
  # ── Build images ─────────────────────────────────────────────────────────────
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runner
      - -t
      - ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/frontend:$SHORT_SHA
      - -t
      - ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/frontend:latest
      - ./frontend

  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA
      - -t
      - ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/backend:latest
      - ./backend

  - id: build-adk
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/adk:$SHORT_SHA
      - -t
      - ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/adk:latest
      - ./adk

  # ── Push images ──────────────────────────────────────────────────────────────
  - id: push-images
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -c
      - |
        docker push ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/frontend:$SHORT_SHA
        docker push ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/frontend:latest
        docker push ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/backend:$SHORT_SHA
        docker push ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/backend:latest
        docker push ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/adk:$SHORT_SHA
        docker push ${_AR_HOST}/$PROJECT_ID/${_AR_REPO}/adk:latest
    waitFor:
      - build-frontend
      - build-backend
      - build-adk

  # ── Deploy to GCE via SSH ────────────────────────────────────────────────────
  - id: deploy
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        gcloud compute ssh $_INSTANCE_NAME \
          --zone=$_INSTANCE_ZONE \
          --tunnel-through-iap \
          --command="
            cd /opt/config-mkpt && \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
          "
    waitFor:
      - push-images

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
